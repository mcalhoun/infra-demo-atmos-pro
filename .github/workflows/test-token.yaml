name: Test Clerk Auth via GitHub OIDC

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Request GitHub OIDC token (aud = app.cloudposse.com)
        id: get-oidc-token
        run: |
          echo "Fetching OIDC token from GitHub with audience 'app.cloudposse.com'..."

          FULL_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=app.cloudposse.com"

          token_response=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$FULL_URL")
          echo "$token_response" | jq -r '.value' > oidc_token.txt

          echo "::add-mask::$(cat oidc_token.txt)"

      - name: Exchange OIDC token with Atmos Pro API
        id: exchange-token
        run: |
          TOKEN=$(cat oidc_token.txt)

          echo "Sending GH OIDC token to ATMOS Pro..."
          response=$(curl -s -w "\n%{http_code}" -X POST https://app.cloudposse.com/api/v1/auth/github-oidc \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"$TOKEN\",\"workspaceId\":\"ws_3Uy96FDVTDhACWDFvHeqyygcfz3N\"}")

          echo "$token_reposonse"|jq

          body=$(echo "$response" | head -n1)
          code=$(echo "$response" | tail -n1)

          echo "Status: $code"
          echo "Response: $body"

          if [ "$code" -ne 200 ]; then
            echo "❌ Token exchange failed"
            exit 1
          fi

          # Extract the JWT from the 'token' field in the response body
          echo "$body" | jq -r '.data.token' > jwt.txt
          echo "::add-mask::$(cat jwt.txt)"
          echo "✅ Token exchange successful"

      - name: Call protected /api/auth/test endpoint
        run: |
          JWT=$(cat jwt.txt)

          echo "Calling /api/auth/test with Bearer token..."
          test_response=$(curl -s -w "\n%{http_code}" -X GET https://app.cloudposse.com/api/v1/auth/test \
            -H "Authorization: Bearer $JWT")

          body=$(echo "$test_response" | head -n1)
          code=$(echo "$test_response" | tail -n1)

          echo "Status: $code"
          echo "Response: $body"

          if [ "$code" -ne 200 ]; then
            echo "❌ Test API call failed"
            exit 1
          fi

          echo "✅ Test API call succeeded"
