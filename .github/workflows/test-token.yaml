name: Test Clerk Auth via GitHub OIDC

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Request GitHub OIDC token (aud = app.cloudposse.com)
        id: get-oidc-token
        run: |
          echo "Fetching OIDC token from GitHub with audience 'app.cloudposse.com'..."

          # Properly construct the full request URL
          FULL_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=app.cloudposse.com"

          # Fetch the token JSON payload
          token_response=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$FULL_URL")

          # Extract the 'value' field from the JSON
          echo "$token_response" | jq -r '.value' > oidc_token.txt

          echo "::add-mask::$(cat oidc_token.txt)"

      - name: Exchange OIDC token with your API
        run: |
          TOKEN=$(cat oidc_token.txt)

          echo "Sending token to your API..."
          response=$(curl -s -w "\n%{http_code}" -X POST https://find-wisconsin-criterion-volunteers.trycloudflare.com/api/auth/github-oidc \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"$TOKEN\"}")

          body=$(echo "$response" | head -n1)
          code=$(echo "$response" | tail -n1)

          echo "Status: $code"
          echo "Response: $body"

          if [ "$code" -ne 200 ]; then
            echo "❌ Token exchange failed"
            exit 1
          fi

          echo "✅ Token exchange successful"
