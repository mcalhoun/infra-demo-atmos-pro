name: Test Clerk Auth via GitHub OIDC

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required to fetch OIDC token
      contents: read

    steps:
      - name: Request OIDC Token
        id: get-token
        run: |
          echo "Requesting GitHub OIDC token with audience 'app.cloudposse.com'..."

          token_response=$(curl -sSf -X POST \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=app.cloudposse.com")

          OIDC_TOKEN=$(echo "$token_response" | jq -r '.value')

          echo "::add-mask::$OIDC_TOKEN"
          echo "$OIDC_TOKEN" > oidc_token.txt

      - name: Exchange OIDC token with your API
        run: |
          TOKEN=$(cat oidc_token.txt)
          echo "Sending token to your API..."

          response=$(curl -s -w "\n%{http_code}" -X POST https://find-wisconsin-criterion-volunteers.trycloudflare.com/api/auth/github-oidc \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"$TOKEN\"}")

          body=$(echo "$response" | head -n1)
          code=$(echo "$response" | tail -n1)

          echo "Status: $code"
          echo "Response: $body"

          if [ "$code" -ne 200 ]; then
            echo "❌ Token exchange failed"
            exit 1
          fi

          echo "✅ Token exchange successful"
